name: Temporary Vercel Deployment Diagnosis

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-vercel-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect stalled production deployments (read-only)
        shell: bash
        run: |
          set -u
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN is not configured for this job"
            exit 1
          fi
          npm install --global vercel@65.11.0
          for id in DYd6DCtVn91yP5WvdfpZ2fxF2KJb H8sSRaUwR2VjZw8MLQpUdZrzrY9x; do
            echo "::group::Vercel deployment metadata: $id"
            timeout 80s vercel inspect "$id" --scope=leo0331s-projects --token="$VERCEL_TOKEN" || echo "Unable to inspect metadata for $id"
            echo "::endgroup::"
            echo "::group::Vercel build logs: $id"
            timeout 80s vercel inspect "$id" --logs --scope=leo0331s-projects --token="$VERCEL_TOKEN" || echo "No accessible build logs for $id"
            echo "::endgroup::"
          done

      - name: Assert verification script rejects a previously BLOCKED deployment
        shell: bash
        run: |
          set +e
          VERCEL_VERIFY_ATTEMPTS=1 bash .github/scripts/verify-vercel-deployment.sh "https://genomic-data-science-with-galaxy-project-81osiwjt6.vercel.app" > "$RUNNER_TEMP/vercel-verify.log" 2>&1
          exit_code=$?
          set -e
          cat "$RUNNER_TEMP/vercel-verify.log"
          if [ "$exit_code" -eq 0 ]; then
            echo "::error::Status checker incorrectly accepted a BLOCKED deployment."
            exit 1
          fi
          if ! grep -q 'Vercel BLOCKED this deployment' "$RUNNER_TEMP/vercel-verify.log"; then
            echo "::error::Status checker did not diagnose the Vercel authorization block."
            exit 1
          fi
          echo "Status verifier correctly rejects a Vercel authorization block."
