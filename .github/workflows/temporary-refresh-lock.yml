name: Temporary lockfile refresh for security fixes

on:
  push:
    branches:
      - fix/tailwind-postcss-vite-ci-20261105

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh package-lock from npm registry
        run: |
          npm install --global npm@11
          if ! npm install --package-lock-only --ignore-scripts --no-audit --no-fund; then
            echo 'npm debug tail:'
            find "$HOME/.npm/_logs" -type f -name '*debug-0.log' -print | sort | tail -1 | xargs -r tail -n 100
            exit 1
          fi
      - name: Commit package-lock without changing package.json
        run: |
          if ! git diff --quiet -- package.json; then
            echo 'npm unexpectedly changed package.json' >&2
            exit 1
          fi
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: refresh lockfile for Tailwind PostCSS and patched Vite'
            git push origin HEAD:fix/tailwind-postcss-vite-ci-20261105
          fi
